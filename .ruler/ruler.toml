# Ruler config: https://github.com/intellectronica/ruler
# Edit this and .ruler/*.md, then run `node apply.mjs` from the repo root.

default_agents = ["claude", "codex"]

# Domain folders (web-development/, ...) have their own .ruler/ and get their
# own generated instructions, skills and MCP config.
nested = true

[mcp]
enabled = true
merge_strategy = "overwrite"

[gitignore]
enabled = true

# Everything is in git, so skip Ruler's .bak copies.
[backup]
enabled = false

# MCP servers for sessions started at the root. The comment line directly
# above each server is its description in MCP-SERVERS.md.

# Library and framework docs, looked up on demand.
[mcp_servers.context7]
type = "http"
url = "https://mcp.context7.com/mcp"
