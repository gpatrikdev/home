# Ruler config for the game-development domain. Applied from the repo root
# with `node apply.mjs` (Ruler nested mode).

default_agents = ["claude", "codex"]

[mcp]
enabled = true
merge_strategy = "overwrite"

[gitignore]
enabled = true

[backup]
enabled = false

# MCP servers for sessions started in game-development/, on top of the shared
# ones in the root .ruler/ruler.toml. The comment line directly above each
# server is its description in MCP-SERVERS.md.

# Godot: launch the editor, run the game and read its debug output, edit scenes.
[mcp_servers.godot]
command = "npx"
args = ["-y", "@coding-solo/godot-mcp"]
