# Ruler config for the web-development domain. Applied from the repo root
# with `node apply.mjs` (Ruler nested mode).

default_agents = ["claude", "codex"]

[mcp]
enabled = true
merge_strategy = "overwrite"

[gitignore]
enabled = true

[backup]
enabled = false

# MCP servers for sessions started in web-development/. Context7 is repeated
# from the root so it is there even if an agent ignores parent MCP config.
# Remote servers ask you to sign in on first use. The comment line directly
# above each server is its description in MCP-SERVERS.md.

# Library and framework docs, looked up on demand.
[mcp_servers.context7]
type = "http"
url = "https://mcp.context7.com/mcp"

# Neon Postgres: projects, branches, SQL and migrations.
[mcp_servers.Neon]
type = "http"
url = "https://mcp.neon.tech/mcp"

# The whole Cloudflare API: Workers, R2, DNS, logs and more.
[mcp_servers.cloudflare-api]
type = "http"
url = "https://mcp.cloudflare.com/mcp"
